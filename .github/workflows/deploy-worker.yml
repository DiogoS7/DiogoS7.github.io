name: Deploy Ask worker

# The Worker bundles data.js and repos.json, so redeploy whenever they change.
on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - "assets/js/data.js"
      - "assets/data/repos.json"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Stop if Cloudflare isn't set up
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::notice::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets to deploy the Worker automatically." && exit 0
      - uses: actions/checkout@v7
        if: env.CLOUDFLARE_API_TOKEN != ''
      - uses: actions/setup-node@v7
        if: env.CLOUDFLARE_API_TOKEN != ''
        with:
          node-version: 24
      - name: Deploy
        if: env.CLOUDFLARE_API_TOKEN != ''
        working-directory: worker
        run: |
          npm ci
          npx wrangler deploy
